<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" role="img" aria-labelledby="title desc">
  <title id="title">Photo placeholder</title>
  <desc id="desc">A patterned area prompting you to add your own photo</desc>
  <defs>
    <pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="3" fill="#1d2940" opacity=".18"/>
